<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Γεννήτρια Ήχου Μπιπ</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/17.0.2/umd/react.development.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/17.0.2/umd/react-dom.development.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/6.26.0/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div id="root"></div>

    <script type="text/babel">
        const BeepGeneratorApp = () => {
            const [beepDuration, setBeepDuration] = React.useState(0.2);
            const [intervalBetweenBeeps, setIntervalBetweenBeeps] = React.useState(0.8);
            const [totalLoopTime, setTotalLoopTime] = React.useState(60);
            const [beepFrequency, setBeepFrequency] = React.useState(1000);
            const [isGenerating, setIsGenerating] = React.useState(false);
            const [audioContext, setAudioContext] = React.useState(null);

            React.useEffect(() => {
                // Δημιουργία AudioContext μόνο όταν υποστηρίζεται από τον browser
                if (window.AudioContext || window.webkitAudioContext) {
                    const context = new (window.AudioContext || window.webkitAudioContext)();
                    setAudioContext(context);
                }
            }, []);

            const generateBeepAudio = () => {
                if (!audioContext) {
                    alert('Ο browser σας δεν υποστηρίζει Web Audio API');
                    return;
                }

                setIsGenerating(true);

                // Δημιουργία πιο ρεαλιστικού ήχου μπιπ
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();

                // Ρύθμιση συχνότητας
                oscillator.frequency.setValueAtTime(beepFrequency, audioContext.currentTime);
                
                // Ρύθμιση καμπύλης έντασης (envelope)
                gainNode.gain.setValueAtTime(0, audioContext.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.5, audioContext.currentTime + 0.01);
                gainNode.gain.linearRampToValueAtTime(0, audioContext.currentTime + beepDuration);

                // Σύνδεση κόμβων
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);

                // Χρονοπρογραμματισμός επαναλήψεων μπιπ
                const startTime = audioContext.currentTime;
                const numRepeats = Math.floor(totalLoopTime / (beepDuration + intervalBetweenBeeps));

                for (let i = 0; i < numRepeats; i++) {
                    const beepStartTime = startTime + i * (beepDuration + intervalBetweenBeeps);
                    
                    // Έναρξη και διακοπή ταλαντωτή
                    oscillator.start(beepStartTime);
                    oscillator.stop(beepStartTime + beepDuration);
                }

                // Τερματισμός διαδικασίας
                setTimeout(() => {
                    setIsGenerating(false);
                }, totalLoopTime * 1000);
            };

            const playAudioPreview = () => {
                if (!audioContext) {
                    alert('Ο browser σας δεν υποστηρίζει Web Audio API');
                    return;
                }

                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();

                oscillator.frequency.setValueAtTime(beepFrequency, audioContext.currentTime);
                
                gainNode.gain.setValueAtTime(0, audioContext.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.5, audioContext.currentTime + 0.01);
                gainNode.gain.linearRampToValueAtTime(0, audioContext.currentTime + beepDuration);

                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);

                oscillator.start();
                oscillator.stop(audioContext.currentTime + beepDuration);
            };

            return (
                <div className="max-w-md mx-auto p-6 bg-white rounded-lg shadow-md">
                    <h1 className="text-2xl font-bold mb-6 text-center">Γεννήτρια Ήχου Μπιπ</h1>
                    
                    <div className="mb-4">
                        <label className="block text-gray-700 mb-2">
                            Διάρκεια Μπιπ (δευτερόλεπτα):
                            <input 
                                type="number" 
                                step="0.1" 
                                min="0.1" 
                                max="5" 
                                value={beepDuration}
                                onChange={(e) => setBeepDuration(parseFloat(e.target.value))}
                                className="w-full p-2 border rounded mt-1"
                            />
                        </label>
                    </div>
                    
                    <div className="mb-4">
                        <label className="block text-gray-700 mb-2">
                            Διάστημα μεταξύ Μπιπ (δευτερόλεπτα):
                            <input 
                                type="number" 
                                step="0.01" 
                                min="0" 
                                max="60" 
                                value={intervalBetweenBeeps}
                                onChange={(e) => setIntervalBetweenBeeps(parseFloat(e.target.value))}
                                className="w-full p-2 border rounded mt-1"
                            />
                        </label>
                    </div>
                    
                    <div className="mb-4">
                        <label className="block text-gray-700 mb-2">
                            Συνολικός Χρόνος (δευτερόλεπτα):
                            <input 
                                type="number" 
                                step="60" 
                                min="60" 
                                max="3600" 
                                value={totalLoopTime}
                                onChange={(e) => setTotalLoopTime(parseFloat(e.target.value))}
                                className="w-full p-2 border rounded mt-1"
                            />
                        </label>
                    </div>

                    <div className="mb-4">
                        <label className="block text-gray-700 mb-2">
                            Συχνότητα Μπιπ (Hz):
                            <input 
                                type="number" 
                                step="100" 
                                min="100" 
                                max="5000" 
                                value={beepFrequency}
                                onChange={(e) => setBeepFrequency(parseFloat(e.target.value))}
                                className="w-full p-2 border rounded mt-1"
                            />
                        </label>
                    </div>
                    
                    <div className="flex space-x-4 mb-4">
                        <button 
                            onClick={generateBeepAudio}
                            disabled={isGenerating}
                            className={`w-1/2 p-3 rounded text-white font-bold ${
                                isGenerating 
                                    ? 'bg-gray-500 cursor-not-allowed' 
                                    : 'bg-blue-600 hover:bg-blue-700 active:bg-blue-800'
                            }`}
                        >
                            {isGenerating ? 'Αναπαραγωγή...' : 'Αναπαραγωγή Ήχου'}
                        </button>

                        <button 
                            onClick={playAudioPreview}
                            disabled={isGenerating}
                            className={`w-1/2 p-3 rounded text-white font-bold ${
                                isGenerating 
                                    ? 'bg-gray-500 cursor-not-allowed' 
                                    : 'bg-green-600 hover:bg-green-700 active:bg-green-800'
                            }`}
                        >
                            Προεπισκόπηση
                        </button>
                    </div>
                    
                    <div className="mt-4 text-sm text-gray-600 text-center">
                        <p>Δημιουργήστε και ακούστε επαναλαμβανόμενους ήχους μπιπ</p>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<BeepGeneratorApp />, document.getElementById('root'));
    </script>
</body>
</html>
